name: Validation Finding
description: Report a problem discovered during Final System Validation
title: "[FINDING] "
labels:
  - "status:needs-triage"
body:
  - type: dropdown
    id: lane
    attributes:
      label: Quality lane
      options:
        - UI/UX & Accessibility — Seb
        - Functional & Business Rules — Arron
        - Reliability & Security — Shane
        - Manuscript & Traceability — Mica
        - Cross-functional / Lead triage needed
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Role tested
      options:
        - Unauthenticated
        - Customer/Renter
        - Operations Staff
        - Owner/Admin
        - Multiple / not role-specific
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: Area
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Suggested severity
      options:
        - P0 — Blocker
        - P1 — Incorrect behavior
        - P2 — UX/workflow/accessibility
        - P3 — Visual/polish
        - P4 — Documentation/manuscript
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      options:
        - Always
        - Sometimes
        - Once
        - Unable to reproduce again
    validations:
      required: true

  - type: textarea
    id: conflict
    attributes:
      label: Context/manuscript conflict
      value: "NONE"

  - type: textarea
    id: handoff
    attributes:
      label: Cross-scope handoff
      value: "NONE"

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I did not modify source code as part of this Finding.
          required: true
        - label: I did not include secrets or private customer data.
          required: true
